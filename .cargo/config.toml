# 打包优化（nsh package 在 .nsh/rust 子工作区运行，.cargo/config.toml 会全局生效）：
# opt-level = "s" 抑制 UI/平台库的过度循环展开与单态泛型膨胀；
# codegen-units = 1 + lto = "thin" 做跨 crate  dead-code 裁剪与内联；
# strip = true 剥离调试符号；
# 音频重采样 / 解码 / FFT / 主色提取等性能敏感库保持 opt-level = 3 享受 SIMD 优化。
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[profile.release.package.rubato]
opt-level = 3

[profile.release.package.rustfft]
opt-level = 3

[profile.release.package.symphonia]
opt-level = 3

[profile.release.package.symphonia-bundle-mp3]
opt-level = 3

[profile.release.package.symphonia-bundle-flac]
opt-level = 3

[profile.release.package.symphonia-codec-aac]
opt-level = 3

[profile.release.package.symphonia-codec-alac]
opt-level = 3

[profile.release.package.symphonia-codec-vorbis]
opt-level = 3

[profile.release.package.color-thief]
opt-level = 3
