[package]
name = "zeo-player"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/*"]

# 各 crate 共用的依赖版本：nsh-* 跟 nightly 频道（nsh update nightly），rev 与
# `nsh --version` 括号里的提交一致，dev-dependencies 里的 nsh-engine / nsh-testing
# 一起改。nightly 不发 crates.io，走 git。`sh scripts/update-nsh.sh` 一键对齐。
[workspace.dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "36b91689c1e7c38379179a56381de7ddab16c6a5", features = ["svg"] }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "36b91689c1e7c38379179a56381de7ddab16c6a5" }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "36b91689c1e7c38379179a56381de7ddab16c6a5" }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "36b91689c1e7c38379179a56381de7ddab16c6a5", default-features = false }
nsh-updater = { git = "https://github.com/longbridge/nsh", rev = "36b91689c1e7c38379179a56381de7ddab16c6a5" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
dunce = "1"
ureq = "3.1"

zeo-types = { path = "crates/types" }
zeo-keybinds = { path = "crates/keybinds" }
zeo-db = { path = "crates/db" }
zeo-metadata = { path = "crates/metadata" }
zeo-library = { path = "crates/library" }
zeo-playlists = { path = "crates/playlists" }
zeo-engine = { path = "crates/engine" }
zeo-icons = { path = "crates/icons" }
zeo-shell = { path = "crates/shell" }
zeo-updater = { path = "crates/updater" }
zeo-ui-store = { path = "crates/ui-store" }
zeo-ui-components = { path = "crates/ui-components" }
zeo-ui-views = { path = "crates/ui-views" }
zeo-ui-views-base = { path = "crates/ui-views-base" }
zeo-ui-view-home = { path = "crates/ui-view-home" }
zeo-ui-view-browse = { path = "crates/ui-view-browse" }
zeo-ui-view-folders = { path = "crates/ui-view-folders" }
zeo-ui-view-playlists = { path = "crates/ui-view-playlists" }
zeo-ui-view-metadata = { path = "crates/ui-view-metadata" }
zeo-ui-view-edit-info = { path = "crates/ui-view-edit-info" }
zeo-ui-view-settings = { path = "crates/ui-view-settings" }
zeo-ui-view-command-palette = { path = "crates/ui-view-command-palette" }
zeo-ui-now-playing = { path = "crates/ui-now-playing" }
zeo-ui-frame = { path = "crates/ui-frame" }

[dependencies]
nsh-core.workspace = true
zeo-shell.workspace = true
zeo-ui-store.workspace = true
zeo-ui-components.workspace = true
zeo-ui-views.workspace = true
zeo-ui-now-playing.workspace = true
zeo-ui-frame.workspace = true
# 根 crate 平铺重导出的领域 crate（测试与外部用 `zeo_player::config` 等路径）。
zeo-types.workspace = true
zeo-db.workspace = true
zeo-metadata.workspace = true
zeo-library.workspace = true
zeo-playlists.workspace = true
zeo-engine.workspace = true

[dev-dependencies]
# 界面测试（tests/ui.rs）：无头引擎运行根组件，不带 QuickJS。
nsh-engine.workspace = true
nsh-testing.workspace = true
nsh-base.workspace = true
serde_json.workspace = true
dunce.workspace = true

# 测试构建（cargo test / nsh test 走 test profile，继承 dev）：无头 UI 测试
# 的时间大头在依赖代码（引擎提交、布局、图像 / 标签解码）——依赖编 O2
# 明显省时；本 crate 只到 O1，迭代重编代价小。行号级调试信息砍掉变量
# 数据：PDB 小、MSVC 链接与 Windows 杀软扫描都快一截。
# release profile 在 .cargo/config.toml（含 opt-s / lto）。
[profile.test]
opt-level = 1
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 2
