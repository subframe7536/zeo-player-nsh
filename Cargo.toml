[package]
name = "zeo-player"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# NSH：与 nsh CLI 同版本（nsh --version），dev-dependencies 里的 nsh-engine / nsh-testing 一起改。
# 见 https://nsh.dev/docs/installation
nsh-core = "0.3.0"
nsh-base = "0.3.0"

# 音频：解码、输出、重采样、系统媒体会话。
symphonia = { version = "0.6", features = ["mp3", "flac", "wav"] }
cpal = "0.18"
rubato = "5"
playwire = "2"

# 曲库：标签、封面缩略图 / 主色调（color-thief 中位切分）、扫描与文件夹监视。
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
color-thief = "0.2.2"
walkdir = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
dunce = "1"
# 「删除文件」移到回收站（macOS Finder / Windows 回收站；Linux 走 freedesktop）。
trash = "5"

# 持久化：数据 / 缓存目录与 JSON；曲目元数据与播放状态存 SQLite（bundled：自带 SQLite，不依赖系统库）。
dirs = "7"
serde = { version = "1", features = ["derive"] }
# 窗口事件唤醒界面（`window::changed`）；NSH 已依赖 tokio，只加 sync。
tokio = { version = "1", default-features = false, features = ["sync"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }

# 已安装字体列表（macOS CoreText、Windows DirectWrite、Linux fontconfig）。
font-enumeration = "0.9"

# 系统文件夹选择器（NSOpenPanel / IFileDialog）；托盘图标与菜单。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { version = "0.17", default-features = false }
tray-icon = "0.26"

# Windows：子类化窗口拦截 WM_CLOSE、接管标题栏的非客户区（应用自己画窗口按钮）、关窗后结束进程、托盘时收缩工作集、音频线程优先级。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

# macOS：替换窗口代理的 windowShouldClose:，在主线程上调度。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "objc2-core-foundation"] }
dispatch2 = "0.3"

# 界面测试（tests/ui.rs）：无头引擎运行根组件，不带 QuickJS。
[dev-dependencies]
nsh-engine = "0.3.0"
nsh-testing = { version = "0.3.0", default-features = false }
