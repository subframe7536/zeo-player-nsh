name: CI

# push / pull_request: check and test only.
# Manual run (Actions → CI → Run workflow): package for macOS and Windows and
# attach both to a draft GitHub release named after nsh.json's version.
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "nsh.json"
      - ".github/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "nsh.json"
      - ".github/**"
  workflow_dispatch:

jobs:
  # 只编译 / 测试 diff 到的 crate，绝不全量：scripts/ci-scope.sh 把改动文件
  # 映射到 crate，再经 cargo metadata 算反向依赖闭包——改了的跑 cargo test，
  # 依赖它的只跑 cargo check（API 破坏在 check 阶段就能抓到，不产生代码）。
  scope:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.scope.outputs.TEST_PKGS }}
      check: ${{ steps.scope.outputs.CHECK_PKGS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          # push：上次推送的 commit；PR：base 分支的 merge-base。
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "$BEFORE" ] && ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # 新分支 / force-push 找不到 before：跟默认分支的 merge-base 比。
            base="$(git merge-base origin/HEAD HEAD || true)"
          else
            base="$BEFORE"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "TEST_PKGS=FULL" >> "$GITHUB_OUTPUT"
            echo "CHECK_PKGS=FULL" >> "$GITHUB_OUTPUT"
          else
            sh scripts/ci-scope.sh "$base" | tee "$GITHUB_OUTPUT"
          fi

  test:
    if: github.event_name != 'workflow_dispatch' && needs.scope.outputs.test != ''
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Test corpus (macOS)
        if: runner.os == 'macOS' && needs.scope.outputs.test != ''
        run: |
          brew install ffmpeg
          sh scripts/make-test-music.sh
      - name: Setup FFmpeg (Windows)
        if: runner.os == 'Windows' && needs.scope.outputs.test != ''
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Test corpus (Windows)
        if: runner.os == 'Windows' && needs.scope.outputs.test != ''
        shell: bash
        run: |
          bash scripts/make-test-music.sh
      - name: Test changed crates
        if: needs.scope.outputs.test != 'FULL'
        shell: bash
        run: cargo test $(for p in ${{ needs.scope.outputs.test }}; do echo -n "-p $p "; done)
      - name: Test all (scope fallback)
        if: needs.scope.outputs.test == 'FULL'
        run: cargo test --workspace
      - name: Check dependents
        if: needs.scope.outputs.check != '' && needs.scope.outputs.check != 'FULL'
        shell: bash
        run: cargo check --all-targets $(for p in ${{ needs.scope.outputs.check }}; do echo -n "-p $p "; done)

  package:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          # Windows 用满幅图标（macOS 惯例的留白图标在任务栏里小一圈；见 AGENTS.md「应用图标」）
          - os: windows-latest
            target: windows
            icon: --icon resources/icon-windows.png
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: nsh package . --target ${{ matrix.target }} ${{ matrix.icon }}
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent ".nsh/out/ZeoPlayer.app" .nsh/out/ZeoPlayer-macos-arm64.zip
      - name: Rename (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item ".nsh/out/ZeoPlayer.zip" .nsh/out/ZeoPlayer-windows-x64.zip
      # archive: false uploads the zip itself instead of wrapping it in a
      # second artifact zip; the artifact is named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: .nsh/out/ZeoPlayer-*.zip
          archive: false

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The artifacts are the zips themselves: keep them as files.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: ZeoPlayer-*.zip
          merge-multiple: true
          skip-decompress: true
      - run: ls -l dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(jq -r .version nsh.json)"
          if gh release view "$version" > /dev/null 2>&1; then
            gh release upload "$version" dist/*.zip --clobber
          else
            gh release create "$version" dist/*.zip --draft --target "$GITHUB_SHA" --title "Zeo Player $version" --generate-notes
          fi
