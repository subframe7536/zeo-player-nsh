name: CI

# push / pull_request: check and test only.
# Manual run (Actions → CI → Run workflow): package for macOS and Windows and
# attach both to a draft GitHub release named after nsh.json's version.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Test corpus
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          sh scripts/make-test-music.sh
      - run: nsh check .
      - run: nsh test .

  package:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: nsh package . --target ${{ matrix.target }}
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent ".nsh/out/Zeo Player.app" .nsh/out/ZeoPlayer-macos-arm64.zip
      - name: Rename (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item ".nsh/out/Zeo Player.zip" .nsh/out/ZeoPlayer-windows-x64.zip
      # archive: false uploads the zip itself instead of wrapping it in a
      # second artifact zip; the artifact is named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: .nsh/out/ZeoPlayer-*.zip
          archive: false

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The artifacts are the zips themselves: keep them as files.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: ZeoPlayer-*.zip
          merge-multiple: true
          skip-decompress: true
      - run: ls -l dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(jq -r .version nsh.json)"
          if gh release view "$version" > /dev/null 2>&1; then
            gh release upload "$version" dist/*.zip --clobber
          else
            gh release create "$version" dist/*.zip --draft --target "$GITHUB_SHA" --title "Zeo Player $version" --generate-notes
          fi
