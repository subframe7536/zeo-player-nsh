name: Setup
description: Rust, the nsh CLI and the platform build tools.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          .

    # QuickJS' bindings (the headless test runner) need libclang on Windows.
    - name: LLVM (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
        "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

    # 只跟 stable 频道：Cargo.toml 的 nsh-* 按 crates.io 版本号走（见
    # AGENTS.md 的 nsh-pin 段）。release 的发布 job 在 ubuntu 上
    # 跑 nsh update-manifest，所以 Linux 也要装（install.sh
    # 有 linux-x86_64 预编译包；GTK 警告只影响运行 app，CLI 不需要）。
    - name: Install nsh (macOS / Linux)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        curl -fsSL https://nsh.dev/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install nsh (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        irm https://nsh.dev/install.ps1 | iex
        "$env:LOCALAPPDATA\nsh\bin" >> $env:GITHUB_PATH

    - shell: bash
      run: nsh --version
