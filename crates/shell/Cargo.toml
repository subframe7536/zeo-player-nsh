[package]
name = "zeo-shell"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nsh-core.workspace = true
# 窗口事件唤醒界面（`window::changed`）；NSH 已依赖 tokio，只加 sync。
tokio = { version = "1", default-features = false, features = ["sync"] }
zeo-types.workspace = true
zeo-engine.workspace = true
zeo-icons.workspace = true

# Windows：子类化窗口拦截 WM_CLOSE、接管标题栏的非客户区（应用自己画窗口按钮）、
# 关窗后结束进程、托盘时收缩工作集、全局媒体键钩子。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# macOS：窗口显示 / 隐藏、Dock 重开与单实例通知的代理挂钩、托盘，在主线程上调度。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSRunningApplication", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSBundle", "NSDictionary", "NSDistributedNotificationCenter", "objc2-core-foundation"] }
dispatch2 = "0.3"
